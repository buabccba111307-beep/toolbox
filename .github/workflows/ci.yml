# 검증 게이트.
# 사이트가 여러 개이므로 매트릭스로 각각 독립 검증한다.
# 한 사이트가 깨져도 다른 사이트의 결과를 그대로 볼 수 있다.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        site: [photo, file, dev]

    defaults:
      run:
        working-directory: sites/${{ matrix.site }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # 워크스페이스라 설치는 루트에서 한 번에 한다.
      - name: Install
        run: npm ci
        working-directory: .

      # astro check 를 쓴다. tsc --noEmit 은 .astro 파일을 검사하지 못한다.
      # 주의: astro check 는 TypeScript 6.x 가 필요하다 (7.x 는 프로그래매틱 API 미제공)
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    strategy:
      fail-fast: false
      matrix:
        site: [photo, file, dev]

    defaults:
      run:
        working-directory: sites/${{ matrix.site }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        working-directory: .

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.site }}
          path: sites/${{ matrix.site }}/playwright-report/
          retention-days: 7
