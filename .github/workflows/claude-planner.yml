# 기획 에이전트
#
# 주기적으로 돌면서 새 도구 아이디어를 내고 이슈를 생성합니다.
# 사람이 손으로 하던 "무엇을 만들지 정하는" 단계를 대신합니다.
#
# ── 자율성 수준 ──────────────────────────────────────────────
# 기본값은 proposed 라벨입니다 = 이슈만 만들고 구현은 시작하지 않음.
# 사람이 approved 로 바꾸면 구현 에이전트가 뜹니다 (클릭 한 번).
#
# 완전 자동으로 돌리려면 아래 프롬프트의 proposed 를 approved 로 바꾸세요.
# 그 경우 claude-dispatch.yml 에 allowed_bots: 'claude' 가 필요합니다 —
# 봇이 만든 이슈는 기본적으로 다른 워크플로를 트리거하지 못하기 때문입니다.
#
# ── 폭주 방지 ────────────────────────────────────────────────
# 실행당 최대 2개. 주 1회. 이 두 숫자가 유일한 제동장치이므로
# 늘리기 전에 사용량을 먼저 확인하세요.

name: Claude Planner

on:
  schedule:
    # 매주 월요일 09:00 UTC (한국 시간 월요일 18:00)
    - cron: '0 9 * * 1'
  workflow_dispatch:  # 수동 실행 (테스트용)

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 20
            --allowedTools "Read,Glob,Grep,mcp__github__*"
          prompt: |
            이 리포지토리에 추가할 새 도구를 기획하고 이슈로 등록하세요.

            ## 1단계: 중복 조사 (먼저 반드시 수행)
            - `src/pages/tools/` 디렉토리를 확인해 이미 있는 도구를 파악하세요.
            - 열려 있는 이슈 목록을 조회해 이미 제안된 도구를 파악하세요.
            - 위 둘과 겹치는 아이디어는 제외합니다.

            ## 2단계: 아이디어 선정 (최대 2개)
            선정 기준:
            - 입력과 출력이 명확해 **순수 함수로 구현하고 테스트할 수 있을 것**.
              판단이나 주관이 개입하는 도구는 제외합니다.
            - 개발자가 검색해서 찾아올 만한 것 (예: "json 포맷터", "cron 표현식 읽기").
            - 서버 없이 브라우저 안에서 완결될 것.
            - 새 의존성 없이 표준 웹 API 로 구현 가능할 것.

            ## 3단계: 이슈 생성
            선정한 각 아이디어마다 이슈를 하나씩 만드세요.

            - 라벨: `proposed`
            - 제목: `<도구 이름> 추가`
            - 본문에 반드시 포함할 것:
              - 이 도구가 무엇을 하는지, 어떤 입력을 받아 무엇을 내놓는지
              - 처리해야 할 경계 조건과 잘못된 입력의 예
              - 구현 절차는 CLAUDE.md 의 "새 도구를 추가하는 표준 절차" 를 따르라고 명시
              - 참고 예시로 `src/lib/px-rem.ts` 와 `src/pages/tools/px-to-rem.astro` 를 지목

            본문은 구현 에이전트가 추가 질문 없이 착수할 수 있을 만큼 구체적이어야 합니다.
            애매한 한 줄짜리 설명은 실패의 원인이 됩니다.

            ## 금지
            - 이슈 생성 외의 어떤 파일도 수정하지 마세요.
            - 2개를 초과해 만들지 마세요.
            - 중복이라 판단되면 아무것도 만들지 말고 그 이유를 출력하세요.
