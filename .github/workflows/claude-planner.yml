# 기획 에이전트
#
# 주기적으로 돌면서 새 도구 아이디어를 내고 이슈를 생성합니다.
# 사람이 손으로 하던 "무엇을 만들지 정하는" 단계를 대신합니다.
#
# ── 자율성 수준 ──────────────────────────────────────────────
# 기본값은 proposed 라벨입니다 = 이슈만 만들고 구현은 시작하지 않음.
# 사람이 approved 로 바꾸면 구현 에이전트가 뜹니다 (클릭 한 번).
#
# 완전 자동으로 돌리려면 아래 프롬프트의 proposed 를 approved 로 바꾸세요.
# 그 경우 claude-dispatch.yml 에 allowed_bots: 'claude' 가 필요합니다 —
# 봇이 만든 이슈는 기본적으로 다른 워크플로를 트리거하지 못하기 때문입니다.
#
# ── 폭주 방지 ────────────────────────────────────────────────
# 실행당 최대 3개. 주 1회. 이 두 숫자가 유일한 제동장치이므로
# 늘리기 전에 사용량을 먼저 확인하세요.

name: Claude Planner

on:
  schedule:
    # 매주 월요일 09:00 UTC (한국 시간 월요일 18:00)
    - cron: '0 9 * * 1'
  workflow_dispatch:  # 수동 실행 (테스트용)

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 25
            --allowedTools "Read,Glob,Grep,WebSearch,mcp__github__*"
          prompt: |
            이 리포지토리의 사이트 중 하나에 추가할 새 도구를 기획하고 이슈로 등록하세요.

            ## 0단계: 구조 파악
            `CLAUDE.md` 를 먼저 읽으세요. 사이트가 주제별로 나뉘어 있습니다.
            아이디어는 **기존 사이트 중 하나의 주제에 정확히 들어맞아야** 합니다.
            어느 사이트에도 안 맞으면 제안하지 마세요.

            ## 1단계: 중복 조사 (반드시 먼저)
            - `sites/*/src/pages/tools/` 를 확인해 이미 있는 도구를 파악하세요.
            - 열려 있는 이슈 목록을 조회해 이미 제안된 도구를 파악하세요.
            - 겹치는 아이디어는 제외합니다.

            ## 2단계: 아이디어 선정 (최대 3개)

            ### 기준 1 — 파일이나 데이터를 가져와야 쓸 수 있을 것

            검색하면 AI 가 즉시 답해버리는 것은 절대 제안하지 마세요. AI Overview 노출
            검색의 83% 가 클릭 없이 끝납니다. **답을 알려주는** 도구는 유입이 없습니다.

            - 제외: 단위 변환, 환율 계산, 날짜 계산, 정규식 설명, 색상 코드 변환
            - 채택: 이미지·오디오·영상·문서를 **처리**하는 것
              → 내 파일이 있어야 하므로 챗봇으로 대체 불가능합니다

            ### 기준 2 — 실제로 수요가 있을 것 (이번에 새로 강화된 기준)

            **"만들면 좋을 것 같다" 는 근거가 아닙니다.** 각 아이디어마다 다음을
            이슈 본문에 명시하세요. 못 쓰겠으면 그 아이디어는 버리세요.

            - **어떤 검색어로 사람들이 찾아오는가** — 구체적인 한국어 검색어 2~3개
              (예: "증명사진 규격 맞추기", "사진 위치정보 삭제")
            - **누가 언제 쓰는가** — 상황을 한 문장으로.
              "개발자가 가끔" 은 시장이 너무 작습니다. 일반인이 반복해서 겪는 일이어야 합니다.
            - **왜 기존 도구로 충분하지 않은가** — 대형 업체가 이미 완벽히 장악한
              동일 기능이면 제안하지 마세요. 업로드를 요구한다, 한국 규격을 지원하지 않는다,
              유료다, 용량 제한이 있다 같은 구체적인 빈틈이 있어야 합니다.

            판단이 서지 않으면 `WebSearch` 로 실제 검색 수요를 확인하세요.

            ### 기준 3 — 기술 제약
            - 브라우저 안에서 완결될 것 (Canvas, WebCodecs, File API, Web Audio, WASM)
            - **새 의존성 없이 표준 웹 API 로 구현 가능할 것**
            - 한 페이지에서 한 가지만 할 것

            ## 3단계: 이슈 생성
            선정한 각 아이디어마다 이슈를 하나씩 만드세요.

            - 라벨: `proposed`
            - 제목: `[사이트명] <도구 이름> 추가`  (예: `[photo] 사진 용량 줄이기 추가`)
            - 본문에 반드시 포함:
              - **어느 사이트에 넣을지** (`sites/photo` 등)와 그 이유
              - **기준 2 의 세 가지 근거** (검색어 / 누가 언제 / 기존 도구의 빈틈)
              - 이 도구가 받는 입력과 내놓는 출력
              - 처리해야 할 경계 조건과 잘못된 입력의 예
              - 구현 절차는 CLAUDE.md 의 "새 도구를 추가하는 표준 절차" 를 따르라고 명시
              - 참고할 기존 도구 파일 경로

            본문은 구현 에이전트가 추가 질문 없이 착수할 수 있을 만큼 구체적이어야 합니다.

            ## 금지
            - 이슈 생성 외의 어떤 파일도 수정하지 마세요.
            - 3개를 초과해 만들지 마세요.
            - **근거를 못 대는 아이디어는 만들지 마세요.** 3개를 채우는 것보다
              근거 있는 1개가 낫습니다. 하나도 없으면 아무것도 만들지 말고 이유를 출력하세요.
